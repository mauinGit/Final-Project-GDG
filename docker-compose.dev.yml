services:
  db:
    image: postgres:16-alpine
    container_name: orderflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - orderflow_pgdata:/var/lib/postgresql/data

volumes:
  orderflow_pgdata: