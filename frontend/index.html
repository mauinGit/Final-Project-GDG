<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f4f5; color: #18181b; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    input, button, select { font-size: 15px; padding: 10px; border-radius: 8px; border: 1px solid #d4d4d8; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #e4e4e7; color: #18181b; }
    label { display: block; margin: 8px 0 4px; font-size: 14px; font-weight: 600; }
    .hidden { display: none; }
    .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .item-row input { flex: 1; }
    .order { border-left: 4px solid #eab308; padding: 12px; margin-bottom: 10px; background: #fafafa; border-radius: 6px; }
    .order.cooking { border-color: #f97316; }
    .order.done { border-color: #22c55e; }
    .order.cancelled { border-color: #ef4444; opacity: .6; }
    .queue { font-size: 22px; font-weight: 700; }
    .status-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #e4e4e7; }
    .muted { color: #71717a; font-size: 13px; }
    .error { color: #dc2626; font-size: 14px; margin-top: 8px; }
    .row-actions { margin-top: 8px; display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>OrderFlow</h1>

    <!-- LOGIN -->
    <div id="loginView" class="card">
      <h2>Masuk</h2>
      <label>Email</label>
      <input id="email" type="email" placeholder="kasir@orderflow.com" style="width:100%" />
      <label>Password</label>
      <input id="password" type="password" placeholder="password123" style="width:100%" />
      <br /><br />
      <button onclick="login()">Login</button>
      <div id="loginError" class="error"></div>
    </div>

    <!-- HEADER SETELAH LOGIN -->
    <div id="appHeader" class="card hidden">
      <span>Login sebagai <b id="roleLabel"></b></span>
      <button class="secondary" style="float:right" onclick="logout()">Keluar</button>
    </div>

    <!-- TAMPILAN KASIR -->
    <div id="kasirView" class="card hidden">
      <h2>Buat Pesanan</h2>
      <label>Nama Pelanggan</label>
      <input id="customerName" placeholder="Nama pelanggan" style="width:100%" />
      <label>Item</label>
      <div id="itemsContainer">
        <div class="item-row">
          <input placeholder="Menu" class="menu" />
          <input placeholder="Qty" class="qty" type="number" value="1" style="max-width:80px" />
          <input placeholder="Catatan" class="note" />
        </div>
      </div>
      <button class="secondary" onclick="addItemRow()">+ Item</button>
      <br /><br />
      <button onclick="createOrder()">Kirim Pesanan</button>
      <div id="kasirError" class="error"></div>
    </div>

    <!-- DAFTAR PESANAN (kasir & koki) -->
    <div id="ordersView" class="card hidden">
      <h2 id="ordersTitle">Daftar Pesanan</h2>
      <p class="muted">Terhubung realtime — pesanan baru muncul otomatis.</p>
      <br />
      <div id="ordersList"></div>
    </div>
  </div>

  <script>
    const API = ""; // kosong = sama host dengan halaman ini
    let token = "";
    let role = "";
    let ws = null;

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      document.getElementById("loginError").textContent = "";
      try {
        const res = await fetch(API + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw new Error("Email atau password salah");
        const data = await res.json();
        token = data.token;
        role = data.role;
        showApp();
      } catch (e) {
        document.getElementById("loginError").textContent = e.message;
      }
    }

    function showApp() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("appHeader").classList.remove("hidden");
      document.getElementById("ordersView").classList.remove("hidden");
      document.getElementById("roleLabel").textContent = role;

      if (role === "kasir") {
        document.getElementById("kasirView").classList.remove("hidden");
        document.getElementById("ordersTitle").textContent = "Pesanan Saya";
      } else {
        document.getElementById("ordersTitle").textContent = "Antrian Dapur";
      }

      loadOrders();
      connectWS();
    }

    function logout() {
      token = ""; role = "";
      if (ws) ws.close();
      location.reload();
    }

    function addItemRow() {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = '<input placeholder="Menu" class="menu" /><input placeholder="Qty" class="qty" type="number" value="1" style="max-width:80px" /><input placeholder="Catatan" class="note" />';
      document.getElementById("itemsContainer").appendChild(row);
    }

    async function createOrder() {
      document.getElementById("kasirError").textContent = "";
      const customer_name = document.getElementById("customerName").value;
      const rows = document.querySelectorAll("#itemsContainer .item-row");
      const items = [];
      rows.forEach(r => {
        const menu = r.querySelector(".menu").value;
        const qty = parseInt(r.querySelector(".qty").value);
        const note = r.querySelector(".note").value;
        if (menu && qty > 0) items.push({ menu_name: menu, quantity: qty, note });
      });

      try {
        const res = await fetch(API + "/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ customer_name, items }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || "Gagal membuat pesanan");
        }
        document.getElementById("customerName").value = "";
        document.getElementById("itemsContainer").innerHTML = '<div class="item-row"><input placeholder="Menu" class="menu" /><input placeholder="Qty" class="qty" type="number" value="1" style="max-width:80px" /><input placeholder="Catatan" class="note" /></div>';
      } catch (e) {
        document.getElementById("kasirError").textContent = e.message;
      }
    }

    async function loadOrders() {
      const res = await fetch(API + "/api/orders", {
        headers: { "Authorization": "Bearer " + token },
      });
      if (!res.ok) return;
      const orders = await res.json();
      renderOrders(orders);
    }

    function renderOrders(orders) {
      const list = document.getElementById("ordersList");
      list.innerHTML = "";
      // Koki fokus ke yang masih aktif; kasir lihat semua.
      const shown = role === "koki"
        ? orders.filter(o => o.status === "pending" || o.status === "cooking")
        : orders;

      if (shown.length === 0) {
        list.innerHTML = '<p class="muted">Belum ada pesanan.</p>';
        return;
      }

      shown.forEach(o => {
        const div = document.createElement("div");
        div.className = "order " + o.status;
        const itemsText = (o.items || []).map(i => `${i.quantity}× ${i.menu_name}${i.note ? " ("+i.note+")" : ""}`).join(", ");
        let actions = "";
        if (role === "koki") {
          if (o.status === "pending") actions = `<button onclick="updateStatus(${o.id}, 'cooking')">Mulai Masak</button>`;
          if (o.status === "cooking") actions = `<button onclick="updateStatus(${o.id}, 'done')">Selesai</button>`;
        }
        if (role === "kasir" && o.status === "pending") {
          actions = `<button class="secondary" onclick="cancelOrder(${o.id})">Batal</button>`;
        }
        div.innerHTML = `
          <span class="queue">#${o.queue_number}</span>
          <span class="status-badge">${o.status}</span>
          <div><b>${o.customer_name}</b></div>
          <div class="muted">${itemsText}</div>
          <div class="row-actions">${actions}</div>
        `;
        list.appendChild(div);
      });
    }

    async function updateStatus(id, status) {
      await fetch(API + `/api/orders/${id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ status }),
      });
      loadOrders();
    }

    async function cancelOrder(id) {
      await fetch(API + `/api/orders/${id}`, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token },
      });
      loadOrders();
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/orders`);
      ws.onmessage = () => {
        // Ada perubahan (pesanan baru / status berubah) → muat ulang daftar.
        loadOrders();
      };
      ws.onclose = () => {
        // Coba sambung lagi setelah 3 detik bila terputus.
        setTimeout(connectWS, 3000);
      };
    }
  </script>
</body>
</html>
